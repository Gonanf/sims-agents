name: Tests automatizados — NarradorPorEventos

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar pytest
        run: pip install pytest
      - name: Ejecutar tests Python
        working-directory: fork
        run: |
          python3 -m pytest tests/ -v --tb=short

  tests-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Ejecutar tests NarradorEngine (xunit)
        working-directory: fork/NarradorEngine.Server.Tests
        run: dotnet test --verbosity normal --no-restore

  build-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar build del mod (mcs)
        working-directory: fork
        run: |
          python3 build_mod_real.py
      - name: Validar package_mod
        working-directory: fork
        run: |
          python3 build/package_mod.py
          python3 -c "import sys; sys.path.insert(0,'build'); exec(open('build/package_mod.py').read()); validate('build/ZZZZitalo.TS3Mods.NarradorPorEventos.package')"

  full-suite:
    needs: [tests-python, tests-dotnet, build-mod]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Suite completa: Python + .NET + build validados"
